name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install exact versions used in the thesis (CPU torch)
        run: |
          python -m pip install --upgrade pip
          pip install -r exp1/dfjsp-ppo-repair/requirements-lock.txt
          pip install -e .
      - name: Locked model files
        run: |
          cd exp1/dfjsp-ppo-repair/runs/e15_validasi
          sha256sum -c --ignore-missing SHA256SUMS
      - name: Files copied unchanged from the thesis repository
        run: grep -v '^#' PROVENANCE.sha256 | sha256sum -c --quiet
      - name: API tests (models, guard, validation parity sample, trace)
        run: pytest -q
      - name: Experiment script tests
        working-directory: revisi/hasil/gerbang_batch
        run: PYTHONPATH=.:../../../exp1/dfjsp-ppo-repair/src pytest -q -p no:cacheprovider
